name: ews_landslide_mobile
description: "Offline-First Multilingual Landslide Early Warning System with Edge TinyML (MDoNER 26001)"
publish_to: 'none'
version: 2.4.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.2
  path: ^1.9.0
  tflite_flutter: ^0.10.4
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  geolocator: ^10.1.0
  camera: ^0.10.5+9
  connectivity_plus: ^5.0.2
  http: ^1.2.0
  uuid: ^4.3.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/tiny_landslide_pinn.tflite
    - assets/l10n/
