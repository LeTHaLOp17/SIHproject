apiVersion: apps/v1
kind: Deployment
metadata:
  name: ner-ai-engine-deployment
  namespace: ews-landslide
  labels:
    app: ai-engine
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ai-engine
  template:
    metadata:
      labels:
        app: ai-engine
    spec:
      containers:
      - name: ai-engine
        image: mdoner-ews/ai-engine:v2.4.0
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "8Gi"
            cpu: "4000m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ner-ai-engine-service
  namespace: ews-landslide
spec:
  type: ClusterIP
  selector:
    app: ai-engine
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ner-ai-engine-hpa
  namespace: ews-landslide
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ner-ai-engine-deployment
  minReplicas: 3
  maxReplicas: 12
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
