name: AI-Powered i18n Localization

on:
  push:
    paths:
      - 'frontend/locales/en.json'
  workflow_dispatch:
    inputs:
      target_languages:
        description: 'Comma-separated target language codes'
        required: false
        default: 'as,hi,bn,bodo,khasi,mni,lus,ne'

jobs:
  translate:
    name: Translate Localization Files with AI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AI Automated Multilingual Translation
        uses: taahamahdi/i18n-ai-translate@v5.3.0
        with:
          api-key: ${{ secrets.OPENAI_API_KEY || secrets.GEMINI_API_KEY }}
          input-file: 'frontend/locales/en.json'
          output-dir: 'frontend/locales'
          target-languages: ${{ github.event.inputs.target_languages || 'as,hi,bn,bodo,khasi,mni,lus,ne' }}

      - name: Commit and Push Updated Translations
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/locales/
          if git diff --staged --quiet; then
            echo "No new translations to commit."
          else
            git commit -m "chore(i18n): automated AI multilingual translation update [skip ci]"
            git push
          fi
